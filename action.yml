name: "DriftGuard verify"
description: "Refuse to ship unless every AI agent verdict matches the exact files it read (SHA-256 attestation gate)."
author: "Reply Intelligence Group"
branding:
  icon: "hash"
  color: "gray-dark"

inputs:
  dir:
    description: "Directory of attestation files, relative to the repository root."
    required: false
    default: ".driftguard/attestations"
  require:
    description: "Files that must be covered by a passing, current attestation. One path per line."
    required: false
    default: ""
  working-directory:
    description: "Repository root to verify against."
    required: false
    default: "."
  fail-on-refusal:
    description: "Fail the step when the gate refuses. Set to 'false' to report only while you roll DriftGuard out."
    required: false
    default: "true"

outputs:
  result:
    description: "'passed' or 'refused'."
    value: ${{ steps.verify.outputs.result }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Build DriftGuard
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --no-audit --no-fund && npm run build
    - name: Verify attestations
      id: verify
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        DG_DIR: ${{ inputs.dir }}
        DG_REQUIRE: ${{ inputs.require }}
        DG_FAIL: ${{ inputs.fail-on-refusal }}
        DG_CLI: ${{ github.action_path }}/dist/src/cli.js
      run: |
        args=(verify --dir "$DG_DIR")
        while IFS= read -r line; do
          line="${line#"${line%%[![:space:]]*}"}"
          line="${line%"${line##*[![:space:]]}"}"
          [ -n "$line" ] && args+=(--require "$line")
        done <<< "$DG_REQUIRE"
        set +e
        node "$DG_CLI" "${args[@]}"
        code=$?
        set -e
        if [ "$code" -eq 0 ]; then
          echo "result=passed" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "result=refused" >> "$GITHUB_OUTPUT"
        if [ "$code" -ne 1 ]; then
          echo "::error title=DriftGuard::verify could not run (exit $code)"
          exit "$code"
        fi
        if [ "$DG_FAIL" = "false" ]; then
          echo "::warning title=DriftGuard::Gate refused (report-only mode, not failing the build)"
          exit 0
        fi
        exit 1
