name: Slipmark

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so Slipmark can compute a diff vs. the last passing run.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - name: Type-check and unit tests
        run: npm test

      # The demos below are built to be refused. Each step passes only when
      # Slipmark catches the planted problem, and fails if it lets it through.
      # In your own project, drop these and let a refusal fail the build.

      - name: "Demo: drift diagnosis catches the planted bug"
        run: |
          set +e
          node dist/src/cli.js dist/packs/demo-shop/pack.js
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then echo "::error::Expected the demo pack to drift (exit 1), got exit $code"; exit 1; fi
          echo "::notice title=Demo::Drift caught, as expected"

      - name: "Demo: verify refuses the stale verdict"
        run: |
          set +e
          node dist/src/cli.js verify --dir examples/attestation/attestations
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then echo "::error::Expected verify to refuse (exit 1), got exit $code"; exit 1; fi
          echo "::notice title=Demo::Stale verdict refused, as expected"

      - name: "Demo: the GitHub Action refuses the stale verdict"
        id: action_demo
        uses: ./
        with:
          dir: examples/attestation/attestations
          fail-on-refusal: "false"

      - name: "Check: the Action reported a refusal"
        env:

          RESULT: ${{ steps.action_demo.outputs.result }}
        run: |
          if [ "$RESULT" != "refused" ]; then echo "::error::The Action let a stale verdict through (result=$RESULT)"; exit 1; fi
          echo "::notice title=Demo::Action refused the stale verdict, as expected"
