name: Slipmark

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # lets the Action record this run in Slipmark Cloud
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so Slipmark can compute a diff vs. the last passing run.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - name: Type-check and unit tests
        run: npm test

      - name: "Check: agent context against GitHub's own renderer"
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/github-render-smoke.mjs

      # The demos below are built to be refused. Each step passes only when
      # Slipmark catches the planted problem, and fails if it lets it through.
      # In your own project, drop these and let a refusal fail the build.

      - name: "Demo: drift diagnosis catches the planted bug"
        run: |
          set +e
          node dist/src/cli.js dist/packs/demo-shop/pack.js
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then echo "::error::Expected the demo pack to drift (exit 1), got exit $code"; exit 1; fi
          echo "::notice title=Demo::Drift caught, as expected"

      - name: "Demo: verify refuses the stale verdict"
        run: |
          set +e
          node dist/src/cli.js verify --dir examples/attestation/attestations
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then echo "::error::Expected verify to refuse (exit 1), got exit $code"; exit 1; fi
          echo "::notice title=Demo::Stale verdict refused, as expected"

      - name: "Demo: the GitHub Action refuses the stale verdict"
        id: action_demo
        uses: ./
        with:
          dir: examples/attestation/attestations
          fail-on-refusal: "false"

      - name: "Check: the Action reported a refusal"
        env:
          RESULT: ${{ steps.action_demo.outputs.result }}
        run: |
          if [ "$RESULT" != "refused" ]; then echo "::error::The Action let a stale verdict through (result=$RESULT)"; exit 1; fi
          echo "::notice title=Demo::Action refused the stale verdict, as expected"

      # The real gate: Slipmark checks its own code. An agent reviewed
      # src/attest/attestation.ts against docs/attestation.md and attested both.
      # Change either file and this refuses until the review is redone.
      - name: "Slipmark: gate this repository"
        id: gate
        uses: ./
        with:
          require: |
            src/attest/attestation.ts
          cloud: "true"

      - name: "Check: the run was recorded in Slipmark Cloud"
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          PROOF: ${{ steps.gate.outputs.proof-url }}
        run: |
          if [ -z "$PROOF" ]; then echo "::error::No Slipmark Cloud proof link was returned"; exit 1; fi
          echo "::notice title=Slipmark Cloud::$PROOF"

  # End to end: sign a real verdict with this job's GitHub identity through
  # Sigstore, then check the gate trusts it, refuses an untrusted signer, and
  # refuses a signed verdict that was edited afterwards.
  signed-verdicts:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # the identity the verdict is signed with
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci && npm run build
      - name: Sign a verdict and verify it
        env:
          ME: https://github.com/${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          mkdir -p "$work/src"
          echo 'export const fee = 2;' > "$work/src/pay.ts"
          cd "$work"
          node "$GITHUB_WORKSPACE/dist/src/cli.js" attest --by security-reviewer --verdict pass --subject src/pay.ts --sign
          echo "Signed as: $ME"
          { echo "### Signed verdict"; echo; echo "Signed as \`$ME\`"; echo; echo '```json'; cat .slipmark/attestations/*.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

          node "$GITHUB_WORKSPACE/dist/src/cli.js" verify --require-signed --trusted-signer "$ME"
          echo "::notice title=Signed verdicts::Trusted signer accepted"

          set +e
          node "$GITHUB_WORKSPACE/dist/src/cli.js" verify --require-signed --trusted-signer "https://github.com/someone/else/.github/workflows/x.yml@refs/heads/main"
          code=$?
          set -e
          [ "$code" -eq 1 ] || { echo "::error::Expected an untrusted signer to be refused, got exit $code"; exit 1; }
          echo "::notice title=Signed verdicts::Untrusted signer refused"

          f=$(ls .slipmark/attestations/*.json)
          node -e 'const fs=require("fs");const f=process.argv[1];const a=JSON.parse(fs.readFileSync(f));a.note="edited after signing";fs.writeFileSync(f,JSON.stringify(a,null,2))' "$f"
          set +e
          node "$GITHUB_WORKSPACE/dist/src/cli.js" verify
          code=$?
          set -e
          [ "$code" -eq 1 ] || { echo "::error::Expected an edited signed verdict to be refused, got exit $code"; exit 1; }
          echo "::notice title=Signed verdicts::Edited verdict refused"
