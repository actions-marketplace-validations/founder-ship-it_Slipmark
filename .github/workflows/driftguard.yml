name: DriftGuard

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so DriftGuard can compute a diff vs. the last passing run.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - name: Type-check and unit tests
        run: npm test
      - name: DriftGuard demo (informational)
        # The demo pack ships a PLANTED bug, so it intentionally drifts and the CLI
        # exits non-zero. That is expected here — it's a teaching example, not a gate.
        # In a real project you DO want this to fail CI on drift (drop continue-on-error).
        continue-on-error: true
        run: node dist/src/cli.js dist/packs/demo-shop/pack.js
