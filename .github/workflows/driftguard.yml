name: DriftGuard

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so DriftGuard can compute a diff vs. the last passing run.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - name: Type-check and unit tests
        run: npm test
      - name: DriftGuard locks (demo pack)
        # Exits non-zero on drift, failing the job — this is the gate.
        run: node dist/src/cli.js dist/packs/demo-shop/pack.js
